<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wascer API — Documentação</title>
  <link rel="alternate" type="text/markdown" href="database-api.md" title="Guia da Database API">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
    .swagger-ui .topbar { display: none; }
    .start { max-width: 1460px; margin: 0 auto; padding: 16px 20px 0; font-family: sans-serif; }
    .start form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; background: #fff; border: 1px solid #d8dde7; border-radius: 6px; padding: 12px 16px; }
    .start label { display: flex; flex-direction: column; font-size: 12px; font-weight: 600; color: #3b4151; gap: 4px; flex: 1 1 260px; }
    .start input { font: 14px monospace; padding: 8px; border: 1px solid #d8dde7; border-radius: 4px; }
    .start button { padding: 9px 18px; background: #4990e2; color: #fff; border: 0; border-radius: 4px; font-weight: 600; cursor: pointer; }
    .start p { font-size: 13px; color: #3b4151; margin: 8px 2px 0; }
  </style>
</head>
<body>
  <div class="start">
    <form id="start">
      <label>Domínio do container<input id="host" placeholder="abc123.soureicdn.com" autocomplete="off"></label>
      <label>API Key (pk_…)<input id="key" placeholder="pk_…" autocomplete="off"></label>
      <button type="submit">Usar</button>
    </form>
    <p>Não tem a chave? Veja <b>Como começar</b> logo abaixo. Os valores ficam só no seu navegador.</p>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    // O painel abre esta página com #base_url=…&api_key=… já preenchidos. Vai no
    // fragmento, não na query, para a chave não chegar a servidor nem log; e sai
    // da barra de endereço antes do Swagger usar o hash.
    var prefill = new URLSearchParams(location.hash.replace(/^#/, ''));
    var baseUrl = prefill.get('base_url');
    var apiKey = prefill.get('api_key');
    if (baseUrl || apiKey) history.replaceState(null, '', location.pathname + location.search);

    document.getElementById('host').value = baseUrl || '';
    document.getElementById('key').value = apiKey || '';
    document.getElementById('start').addEventListener('submit', function (e) {
      e.preventDefault();
      var host = document.getElementById('host').value.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
      var key = document.getElementById('key').value.trim();
      var p = new URLSearchParams();
      if (host) p.set('base_url', host);
      if (key) p.set('api_key', key);
      location.hash = p.toString();
      location.reload();
    });

    fetch('openapi.json')
      .then(function (r) { return r.json(); })
      .then(function (spec) {
        if (baseUrl) {
          spec.servers = [{ url: /^https?:\/\//.test(baseUrl) ? baseUrl : 'https://' + baseUrl }];
        }
        if (apiKey) {
          Object.values(spec.paths).forEach(function (ops) {
            Object.values(ops).forEach(function (op) {
              (op.parameters || []).forEach(function (p) {
                if (p.name !== 'api_key') return;
                // O Swagger UI preenche pelo example antes do default.
                p.example = apiKey;
                p.schema = Object.assign({}, p.schema, { default: apiKey, example: apiKey });
              });
            });
          });
        }
        SwaggerUIBundle({
          spec: spec,
          dom_id: '#swagger-ui',
          deepLinking: true,
          layout: 'StandaloneLayout',
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          plugins: [SwaggerUIBundle.plugins.DownloadUrl],
          docExpansion: 'list',
          defaultModelsExpandDepth: 1,
          tryItOutEnabled: !!apiKey,
        });
      });
  </script>
</body>
</html>
