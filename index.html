<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wascer API — Documentação</title>
  <link rel="alternate" type="text/markdown" href="database-api.md" title="Guia da Database API">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
    .swagger-ui .topbar { display: none; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    // O painel abre esta página com #base_url=…&api_key=… já preenchidos. Vai no
    // fragmento, não na query, para a chave não chegar a servidor nem log; e sai
    // da barra de endereço antes do Swagger usar o hash.
    var prefill = new URLSearchParams(location.hash.replace(/^#/, ''));
    var baseUrl = prefill.get('base_url');
    var apiKey = prefill.get('api_key');
    if (baseUrl || apiKey) history.replaceState(null, '', location.pathname + location.search);

    fetch('openapi.json')
      .then(function (r) { return r.json(); })
      .then(function (spec) {
        if (baseUrl) {
          spec.servers = [{ url: /^https?:\/\//.test(baseUrl) ? baseUrl : 'https://' + baseUrl }];
        }
        if (apiKey) {
          Object.values(spec.paths).forEach(function (ops) {
            Object.values(ops).forEach(function (op) {
              (op.parameters || []).forEach(function (p) {
                if (p.name !== 'api_key') return;
                // O Swagger UI preenche pelo example antes do default.
                p.example = apiKey;
                p.schema = Object.assign({}, p.schema, { default: apiKey, example: apiKey });
              });
            });
          });
        }
        SwaggerUIBundle({
          spec: spec,
          dom_id: '#swagger-ui',
          deepLinking: true,
          layout: 'StandaloneLayout',
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          plugins: [SwaggerUIBundle.plugins.DownloadUrl],
          docExpansion: 'list',
          defaultModelsExpandDepth: 1,
          tryItOutEnabled: !!apiKey,
        });
      });
  </script>
</body>
</html>
